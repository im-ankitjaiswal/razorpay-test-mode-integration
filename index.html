<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Razorpay Test Mode Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 16px; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; font-size: 16px; box-sizing: border-box; }
    button { cursor: pointer; }
    #result { margin-top: 20px; padding: 10px; border-radius: 6px; display: none; }
    .ok { background: #e6f4ea; } .fail { background: #fdecea; }
  </style>
</head>
<body>
  <h2>Razorpay Test Mode Demo</h2>
  <label for="amount">Amount (INR)</label>
  <input id="amount" type="number" min="1" value="100">
  <button id="payBtn">Pay</button>
  <div id="result"></div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    const keyId = "{{ key_id }}";
    const resultEl = document.getElementById("result");

    function show(msg, ok) {
      resultEl.style.display = "block";
      resultEl.className = ok ? "ok" : "fail";
      resultEl.textContent = msg;
    }

    document.getElementById("payBtn").addEventListener("click", async () => {
      const amount = document.getElementById("amount").value;
      const res = await fetch("/create-order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount })
      });
      const order = await res.json();
      if (!res.ok) { show(order.error || "Could not create order", false); return; }

      const options = {
        key: keyId,
        amount: order.amount,
        currency: order.currency,
        name: "Test Store",
        description: "Test transaction",
        order_id: order.order_id,
        handler: async function (response) {
          const v = await fetch("/verify-payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(response)
          });
          const out = await v.json();
          show(v.ok ? "Payment verified: " + out.payment_id
                    : "Verification failed: " + out.error, v.ok);
        }
      };
      const rzp = new Razorpay(options);
      rzp.on("payment.failed", function (resp) {
        show("Payment failed: " + resp.error.description, false);
      });
      rzp.open();
    });
  </script>
</body>
</html>
